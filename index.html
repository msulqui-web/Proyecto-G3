<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1117">
  <title>AlgebraOps · Propiedades algebraicas I</title>
  <style>
    :root {
      --bg: #0c1117;
      --pn: #141c25;
      --ln: #243240;
      --tx: #d6e0ea;
      --mu: #7d8fa1;
      --ok: #4fd1a1;
      --bad: #ef6f6f;
      --ac: #5aa9e6;
      --gold: #e2b857;
      --f: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, "Courier New", monospace
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 var(--f)
    }

    body {
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      overflow-x: hidden
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    body.has-strip #app {
      padding-top: calc(56px + env(safe-area-inset-top, 0px))
    }

    h1 {
      font-size: 22px;
      margin: 0;
      letter-spacing: .5px
    }

    h2 {
      font-size: 17px;
      margin: 0
    }

    .mu {
      color: var(--mu);
      font-size: 13px
    }

    .ok {
      color: var(--ok)
    }

    .bad {
      color: var(--bad)
    }

    .gold {
      color: var(--gold)
    }

    .pn {
      background: var(--pn);
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 16px
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: 44px;
      background: #0a0f14;
      border: 1px solid var(--ln);
      border-radius: 6px;
      color: var(--tx);
      font: inherit;
      font-size: 15px;
      padding: 11px;
      outline: none
    }

    input:focus,
    textarea:focus,
    select:focus,
    button:focus-visible {
      border-color: var(--ac);
      box-shadow: 0 0 0 2px #5aa9e655;
      outline: 2px solid var(--ac);
      outline-offset: 2px
    }

    button {
      font: inherit;
      min-height: 44px;
      color: var(--tx);
      background: var(--pn);
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 12px 14px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s
    }

    button:active {
      background: #1b2733
    }

    .pri {
      background: var(--ac);
      color: #06121c;
      border-color: var(--ac);
      text-align: center;
      font-weight: 700
    }

    .pri:active {
      background: #4a95cc
    }

    .btn-dan {
      background: #36171a;
      border-color: #7d262e;
      color: #ff9e9e;
      text-align: center
    }

    .btn-dan:active {
      background: #4f1e24
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      flex-wrap: wrap;
      gap: 6px
    }

    .bar {
      height: 4px;
      background: var(--ln);
      border-radius: 2px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac);
      transition: width .4s
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      border: 1px solid var(--ln);
      color: var(--ac);
      padding: 2px 8px;
      border-radius: 4px
    }

    .q {
      font-size: 17px;
      margin: 10px 0 14px;
      white-space: pre-line
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .opts button.ok {
      border-color: var(--ok);
      background: #4fd1a118
    }

    .opts button.no {
      border-color: var(--bad);
      background: #ef6f6f18
    }

    .opts button[disabled] {
      cursor: default
    }

    .shake {
      animation: sh .35s
    }

    @keyframes sh {

      20%,
      60% {
        transform: translateX(-6px)
      }

      40%,
      80% {
        transform: translateX(6px)
      }
    }

    .pulse {
      animation: pl .6s
    }

    @keyframes pl {
      40% {
        box-shadow: 0 0 0 6px #4fd1a133, 0 0 24px #4fd1a155
      }
    }

    .fx {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      color: var(--ok);
      font-weight: 700;
      opacity: 0;
      animation: fx 1s ease-out forwards;
      z-index: 9
    }

    @keyframes fx {
      0% {
        opacity: 1;
        transform: translate(0, 0)
      }

      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy))
      }
    }

    .pts {
      position: fixed;
      left: 50%;
      top: 38%;
      transform: translateX(-50%);
      color: var(--gold);
      font-size: 26px;
      font-weight: 700;
      pointer-events: none;
      animation: up 1s forwards;
      z-index: 9
    }

    @keyframes up {
      0% {
        opacity: 0;
        margin-top: 20px
      }

      20% {
        opacity: 1
      }

      100% {
        opacity: 0;
        margin-top: -50px
      }
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--ln);
      font-size: 13px
    }

    .row:last-child {
      border: 0
    }

    .row b {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .row .bar {
      width: 70px
    }

    .fm {
      font-size: clamp(15px, 4.5vw, 20px);
      color: var(--gold);
      text-align: center;
      padding: 12px;
      border: 1px dashed var(--ln);
      border-radius: 6px;
      margin: 10px 0;
      overflow-x: auto;
      word-break: break-word
    }

    /* Franja fija superior de ranking en vivo (máx 56px de alto) */
    .rk-strip {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      height: calc(48px + env(safe-area-inset-top, 0px));
      max-height: 56px;
      padding: env(safe-area-inset-top, 0px) 12px 0;
      background: #10161f;
      border-bottom: 1px solid var(--ln);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 2px 10px #000000aa;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .25s, border-color .25s
    }

    .rk-strip:active {
      background: #16202c
    }

    .rk-strip.hid {
      display: none !important
    }

    .strip-podium {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      font-size: 11px;
      flex: 1
    }

    .strip-item {
      display: inline-flex;
      align-items: center;
      gap: 3px
    }

    .strip-me {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--tx)
    }

    .strip-arrow {
      font-size: 9px;
      color: var(--mu);
      transition: transform .2s
    }

    .strip-arrow.open {
      transform: rotate(180deg)
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      background: var(--mu);
      transition: background .3s
    }

    .dot.on {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok)
    }

    /* Animación sobria al subir de puesto (~1s) */
    .rank-up {
      animation: rankGlow 1s ease-out
    }

    @keyframes rankGlow {
      0% {
        background: #10161f;
        border-bottom-color: var(--ln)
      }

      30% {
        background: #153325;
        border-bottom-color: var(--ok);
        box-shadow: 0 0 16px #4fd1a155
      }

      100% {
        background: #10161f;
        border-bottom-color: var(--ln);
        box-shadow: 0 2px 10px #000000aa
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .rank-up {
        animation: none !important
      }
    }

    /* Desplegable de clasificación completa al tocar la franja */
    .rk-drop {
      position: fixed;
      inset: 0;
      top: calc(48px + env(safe-area-inset-top, 0px));
      z-index: 49;
      display: flex;
      flex-direction: column
    }

    .rk-drop.hid {
      display: none !important
    }

    .drop-bg {
      position: absolute;
      inset: 0;
      background: #00000088;
      backdrop-filter: blur(2px)
    }

    .drop-pn {
      position: relative;
      background: #141c25;
      border-bottom: 2px solid var(--ac);
      border-radius: 0 0 14px 14px;
      max-height: 72vh;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 12px 30px #000000cc;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      animation: shDown .2s ease-out
    }

    @keyframes shDown {
      from {
        transform: translateY(-12px);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    .drop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--ln)
    }

    .drop-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--tx)
    }

    .sheet-list {
      overflow-y: auto;
      max-height: 55vh;
      display: flex;
      flex-direction: column
    }

    .rk-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      border-bottom: 1px solid var(--ln);
      font-size: 13px
    }

    .rk-row.me {
      background: #5aa9e618;
      border-radius: 6px;
      border-color: var(--ac);
      font-weight: 700
    }

    .rk-pos {
      width: 24px;
      color: var(--mu);
      text-align: center;
      font-size: 12px;
      font-weight: 700
    }

    .rk-pos.top1 {
      color: var(--gold)
    }

    .rk-pos.top2 {
      color: #d6e0ea
    }

    .rk-pos.top3 {
      color: #cd7f32
    }

    .rk-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .rk-score {
      color: var(--gold);
      font-weight: 700;
      text-align: right
    }

    .rk-sep {
      text-align: center;
      color: var(--mu);
      padding: 6px 0;
      font-size: 11px
    }

    /* Vista Proyector (#ranking) */
    .proj {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 6px
    }

    .proj h1 {
      font-size: 24px;
      margin: 0
    }

    .proj .rk-row {
      padding: 11px 8px;
      font-size: 15px
    }

    .proj .rk-pos {
      width: 32px;
      font-size: 15px
    }

    .proj .rk-score {
      font-size: 15px
    }

    /* Estilos del Panel de Administración (#admin) */
    .adm-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ln)
    }

    .adm-tabs {
      display: flex;
      gap: 4px;
      background: #0a0f14;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--ln);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch
    }

    .adm-tab {
      flex: 1;
      text-align: center;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--mu);
      white-space: nowrap;
      background: transparent;
      border: 0;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s
    }

    .adm-tab.active {
      background: var(--ac);
      color: #06121c;
      font-weight: 700
    }

    .sym-bar {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 8px 4px;
      background: #0d141d;
      border: 1px solid var(--ln);
      border-radius: 6px;
      position: sticky;
      top: 0;
      z-index: 45;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 10px
    }

    .sym-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 36px;
      padding: 2px 8px;
      font-size: 15px;
      font-family: var(--f);
      background: var(--pn);
      border: 1px solid var(--ln);
      border-radius: 4px;
      color: var(--tx);
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      width: auto
    }

    .sym-btn:active {
      background: var(--ac);
      color: #06121c
    }

    .adm-sec {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .adm-fld {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .adm-fld label {
      font-size: 12px;
      color: var(--mu);
      font-weight: 700
    }

    .adm-fld textarea {
      min-height: 70px;
      resize: vertical
    }

    .adm-q-item {
      background: var(--pn);
      border: 1px solid var(--ln);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .adm-q-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12px
    }

    .adm-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .adm-btn-sm {
      padding: 6px 10px;
      min-height: 36px;
      font-size: 12px;
      border-radius: 4px;
      text-align: center;
      width: auto
    }

    .adm-save-bar {
      position: sticky;
      bottom: 0;
      background: #10161f;
      border-top: 1px solid var(--ln);
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40
    }

    .adm-status-msg {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center
    }

    .adm-status-msg.ok {
      background: #4fd1a122;
      color: var(--ok);
      border: 1px solid var(--ok)
    }

    .adm-status-msg.err {
      background: #ef6f6f22;
      color: var(--bad);
      border: 1px solid var(--bad)
    }

    .adm-preview-box {
      background: #0a0f14;
      border: 1px dashed var(--ac);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

        { level: 2, type: "tf", text: "6x + 9 = 3(2x + 3)", options: [], answer: 0, explain: "Verdadero: 3 es factor común de 6x y 9." },
        { level: 2, type: "num", text: "Evalúa a(b + c) con a = 4, b = 3, c = 5.", options: [], answer: 32, explain: "4(3 + 5) = 4 × 8 = 32." },
        { level: 2, type: "mc", text: "Ingeniería en Sistemas: un algoritmo hace 3n + 3m operaciones. Aplicando factor común queda…", options: ["3(n + m)", "3nm", "n + m + 3", "6(n + m)"], answer: 0, explain: "3n + 3m = 3(n + m): una multiplicación en lugar de dos." },
        { level: 3, type: "num", text: "Calcula de cabeza con 98 = 100 − 2:\n7 × 98", options: [], answer: 686, explain: "7(100 − 2) = 700 − 14 = 686." },
        { level: 3, type: "num", text: "Calcula de cabeza con 105 = 100 + 5:\n12 × 105", options: [], answer: 1260, explain: "12(100 + 5) = 1200 + 60 = 1260." },
        { level: 3, type: "tf", text: "13 × 101 = 1313", options: [], answer: 0, explain: "13(100 + 1) = 1300 + 13 = 1313." },
        { level: 3, type: "num", text: "Ingeniería en Sistemas: una licencia cuesta $19 por usuario. Estima el costo para 30 usuarios con 30 × (20 − 1).", options: [], answer: 570, explain: "600 − 30 = 570." }
      ]
    };

    let CONTENT = JSON.parse(JSON.stringify(DEFAULT_CONTENT));

    function validateContent(c) {
      if (!c || typeof c !== "object") return false;
      if (typeof c.v !== "number") return false;
      if (typeof c.title !== "string" || !c.title.trim()) return false;
      if (typeof c.subtitle !== "string") return false;
      if (!c.ui || typeof c.ui !== "object") return false;
      if (!c.points || typeof c.points !== "object") return false;
      if (typeof c.points.base !== "number" || typeof c.points.streakBonus !== "number" || typeof c.points.streakMax !== "number") return false;
      if (!Array.isArray(c.levels) || c.levels.length < 1) return false;
      for (let i = 0; i < c.levels.length; i++) {
        const l = c.levels[i];
        if (!l || typeof l !== "object") return false;
        if (typeof l.name !== "string" || !l.name.trim()) return false;
        if (typeof l.theory !== "string" || typeof l.formula !== "string") return false;
      }
      if (!Array.isArray(c.questions) || c.questions.length < 1) return false;
      for (let j = 0; j < c.questions.length; j++) {
        const q = c.questions[j];
        if (!q || typeof q !== "object") return false;
        if (typeof q.level !== "number" || q.level < 0 || q.level >= c.levels.length) return false;
        if (!["mc", "tf", "num"].includes(q.type)) return false;
        if (typeof q.text !== "string" || !q.text.trim()) return false;
        if (typeof q.explain !== "string") return false;
        if (q.type === "mc") {
          if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 5) return false;
          if (!q.options.every(o => typeof o === "string" && o.trim().length > 0)) return false;
          if (typeof q.answer !== "number" || q.answer < 0 || q.answer >= q.options.length) return false;
        } else if (q.type === "tf") {
          if (q.answer !== 0 && q.answer !== 1) return false;
        } else if (q.type === "num") {
          if (typeof q.answer !== "number" || isNaN(q.answer)) return false;
        }
      }
      return true;
    }

    const $ = s => document.querySelector(s), app = $("#app");
    const rnd = () => Math.random().toString(36).slice(2, 10);
    const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    const escBr = s => esc(s).replace(/\n/g, "<br>");
    const shortN = s => (s || "").length > 6 ? (s.slice(0, 5) + "…") : (s || "Anónimo");

    let db = null;
    let auth = null;
    let isOnline = false;
    let roomData = {};
    let serverTimeOffset = 0;
    let lastRenderTime = 0;
    let renderThrottleTm = null;
    let lastKnownPos = null;
    let isDropOpen = false;
    let cleanupExecuted = false;
    let activeTextEl = null;

    const getServerTime = () => Date.now() + serverTimeOffset;

    let S = null;
    try {
      const raw = localStorage.getItem("ao_s");
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === "object" && typeof p.id === "string" && typeof p.name === "string") {
          const recT = typeof p.t === "number" ? p.t : 0;
          if (recT > 0 && (Date.now() - recT > TTL)) {
            // Caducado (> 4h): descartar estado local y volver al login
            localStorage.removeItem("ao_s");
            S = null;
          } else {
            S = {
              id: p.id,
              name: p.name,
              i: typeof p.i === "number" && !isNaN(p.i) ? Math.max(0, p.i) : 0,
              score: typeof p.score === "number" && !isNaN(p.score) ? p.score : 0,
              streak: typeof p.streak === "number" && !isNaN(p.streak) ? p.streak : 0,
              ok: typeof p.ok === "number" && !isNaN(p.ok) ? p.ok : 0,
              sub: Array.isArray(p.sub) ? p.sub : [],
              intro: typeof p.intro === "number" ? p.intro : -1,
              t: recT || Date.now()
            };
          }
        }
      }
    } catch (e) { S = null; }

    try {
      if (typeof firebase !== "undefined" && firebase.apps) {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        auth = firebase.auth();
        try {
          auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
        } catch (e) { }
      }
    } catch (e) { db = null; auth = null; }

    /* Carga inicial del contenido: lectura única (get/once) sin listener */
    function loadInitialContent(cb) {
      try {
        const local = localStorage.getItem("ao_content");
        if (local) {
          const parsed = JSON.parse(local);
          if (validateContent(parsed)) CONTENT = parsed;
        }
      } catch (e) { }

      if (!db) { if (cb) cb(); return; }

      db.ref("content/" + ROOM).once("value").then(snap => {
        const val = snap.val();
        if (val && validateContent(val)) {
          CONTENT = val;
          try { localStorage.setItem("ao_content", JSON.stringify(CONTENT)); } catch (e) { }
        }
        if (cb) cb();
      }).catch(() => {
        if (cb) cb();
      });
    }

    /* Escritura de jugador: solo campos { n, sc, d, t } con TTL y límites */
    function push() {
      if (!S) return;
      const now = getServerTime();
      S.t = now;
      try { localStorage.setItem("ao_s", JSON.stringify(S)); } catch (e) { }
      if (!db) return;
      try {
        const scVal = Math.min(Math.max(0, Number(S.score) || 0), 20000);
        const dVal = Math.min(Math.max(0, Number(S.i) || 0), 100);
        db.ref("rooms/" + ROOM + "/" + S.id).set({
          n: String(S.name).slice(0, 24),
          sc: scVal,
          d: dVal,
          t: now
        }).catch(() => { });
      } catch (e) { }
    }

    const html = h => { app.innerHTML = h; };

    /* ---------- Firebase Listeners (Ranking en vivo y .info/connected) ---------- */
    function initFirebase() {
      if (!db) return updateConnIndicator();
      try {
        db.ref(".info/connected").on("value", snap => {
          isOnline = snap.val() === true;
          updateConnIndicator();
          scheduleRankingRender();
        });
        db.ref(".info/serverTimeOffset").on("value", snap => {
          serverTimeOffset = Number(snap.val()) || 0;
        });
        db.ref("rooms/" + ROOM).on("value", snap => {
          roomData = snap.val() || {};
          scheduleRankingRender();
        }, () => {
          isOnline = false;
          updateConnIndicator();
        });
      } catch (e) {
        isOnline = false;
        updateConnIndicator();
      }
    }

    function updateConnIndicator() {
      const dot = $("#strip-dot");
      if (dot) {
        if (isOnline) dot.classList.add("on");
        else dot.classList.remove("on");
      }
    }

    /* Throttle de renderizado: máximo 1 vez por segundo */
    function scheduleRankingRender() {
      const now = Date.now();
      const timeSinceLast = now - lastRenderTime;
      if (timeSinceLast >= 1000) {
        lastRenderTime = now;
        renderRanking();
      } else if (!renderThrottleTm) {
        renderThrottleTm = setTimeout(() => {
          renderThrottleTm = null;
          lastRenderTime = Date.now();
          renderRanking();
        }, 1000 - timeSinceLast);
      }
    }

    /* Filtrado por TTL de 4 horas y limpieza automática (máx 20 borrados sin bucles) */
    function getSortedRanking() {
      const now = getServerTime();
      const valid = [];
      const expiredKeys = [];

      for (const [id, u] of Object.entries(roomData)) {
        if (!u || typeof u !== "object") continue;
        const recT = typeof u.t === "number" ? u.t : 0;
        if (recT > 0 && (now - recT > TTL)) {
          expiredKeys.push(id);
        } else {
          valid.push({
            id,
            n: String(u.n || "Anónimo"),
            sc: typeof u.sc === "number" ? u.sc : 0,
            d: typeof u.d === "number" ? u.d : 0,
            t: recT
          });
        }
      }

      // Limpieza de vencidos: máx 20 por apertura sin bucles
      if (expiredKeys.length > 0 && !cleanupExecuted && db) {
        cleanupExecuted = true;
        const toDel = expiredKeys.slice(0, 20);
        toDel.forEach(k => {
          try { db.ref("rooms/" + ROOM + "/" + k).remove().catch(() => { }); } catch (e) { }
        });
      }

      valid.sort((a, b) => (b.sc - a.sc) || (a.d - b.d) || a.n.localeCompare(b.n));
      return valid;
    }

    function renderRankingListHtml(list, limitAll) {
      if (!list.length) {
        return `<div class="mu" style="text-align:center;padding:16px 0">${isOnline ? "Esperando jugadores en la sala…" : "Sin jugadores registrados"}</div>`;
      }
      const myId = S ? S.id : null;
      const myIdx = myId ? list.findIndex(u => u.id === myId) : -1;
      const items = limitAll ? list : list.slice(0, 10);
      const totQ = CONTENT.questions.length;

      let h = items.map((u, i) => {
        const isMe = u.id === myId;
        const posClass = i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "";
        return `<div class="rk-row ${isMe ? "me" : ""}">
      <span class="rk-pos ${posClass}">${i + 1}</span>
      <b class="rk-name">${esc(u.n)}${isMe ? " (tú)" : ""}</b>
      <span class="mu" style="font-size:11px">${u.d}/${totQ}</span>
      <span class="rk-score">${u.sc}</span>
    </div>`;
      }).join("");

      if (!limitAll && myIdx >= 10) {
        const me = list[myIdx];
        h += `<div class="rk-sep">··· tu posición real ···</div>
    <div class="rk-row me">
      <span class="rk-pos">${myIdx + 1}</span>
      <b class="rk-name">${esc(me.n)} (tú)</b>
      <span class="mu" style="font-size:11px">${me.d}/${totQ}</span>
      <span class="rk-score">${me.sc}</span>
    </div>`;
      }
      return h;
    }

    function renderRanking() {
      const list = getSortedRanking();
      const myId = S ? S.id : null;
      const myIdx = myId ? list.findIndex(u => u.id === myId) : -1;
      const myPos = myIdx >= 0 ? (myIdx + 1) : 0;

      // Animación sobria al subir de puesto (~1s)
      if (lastKnownPos !== null && myPos > 0 && myPos < lastKnownPos) {
        const strip = $("#rk-strip");
        if (strip) {
          strip.classList.add("rank-up");
          setTimeout(() => strip.classList.remove("rank-up"), 1000);
        }
      }
      if (myPos > 0) lastKnownPos = myPos;

      // Actualizar franja fija superior
      const podiumEl = $("#strip-podium");
      if (podiumEl) {
        if (!isOnline || !db) {
          podiumEl.innerHTML = `<span class="mu">Modo local · ${S ? esc(S.name) : ""}</span>`;
        } else if (!list.length) {
          podiumEl.innerHTML = `<span class="mu">Esperando jugadores…</span>`;
        } else {
          const top3 = list.slice(0, 3);
          const colors = ["var(--gold)", "#d6e0ea", "#cd7f32"];
          podiumEl.innerHTML = top3.map((u, i) =>
            `<span class="strip-item"><b style="color:${colors[i]}">${i + 1}</b> ${esc(shortN(u.n))} <span class="mu">${u.sc}</span></span>`
          ).join('<span class="mu" style="opacity:.4">·</span>');
        }
      }

      const myPosEl = $("#strip-mypos");
      if (myPosEl) {
        if (!isOnline || !db) {
          myPosEl.textContent = `Tú: ${S ? S.score : 0} pts`;
        } else {
          myPosEl.textContent = `Tú: #${myPos > 0 ? myPos : "-"}`;
        }
      }

      // Actualizar desplegable
      const dropStatusEl = $("#drop-status");
      if (dropStatusEl) {
        dropStatusEl.innerHTML = (!isOnline || !db)
          ? `<span class="bad">● Modo local</span>`
          : `<span class="ok">● En vivo</span> · ${list.length} en sala`;
      }
      const dropListEl = $("#drop-list");
      if (dropListEl) dropListEl.innerHTML = renderRankingListHtml(list, false);

      // Si estamos en la vista de proyector (#ranking)
      if (location.hash === "#ranking") {
        const pMeta = $("#proj-meta");
        if (pMeta) {
          pMeta.innerHTML = (!isOnline || !db)
            ? `<span class="bad">● Modo local</span> · Sala: ${esc(ROOM)}`
            : `<span class="ok">● En vivo</span> · ${list.length} estudiantes conectados · Sala: ${esc(ROOM)}`;
        }
        const pList = $("#proj-list");
        if (pList) pList.innerHTML = renderRankingListHtml(list, true);
      }
    }

    function openDrop() {
      const drop = $("#rk-drop");
      const arrow = $("#strip-arrow");
      const strip = $("#rk-strip");
      if (drop) {
        drop.classList.remove("hid");
        isDropOpen = true;
        if (arrow) arrow.classList.add("open");
        if (strip) strip.setAttribute("aria-expanded", "true");
        renderRanking();
      }
    }

    function closeDrop() {
      const drop = $("#rk-drop");
      const arrow = $("#strip-arrow");
      const strip = $("#rk-strip");
      if (drop) drop.classList.add("hid");
      isDropOpen = false;
      if (arrow) arrow.classList.remove("open");
      if (strip) strip.setAttribute("aria-expanded", "false");
    }

    function toggleDrop() {
      if (isDropOpen) closeDrop();
      else openDrop();
    }

    /* ---------- Pantallas del Juego ---------- */
    function login() {
      document.body.classList.remove("has-strip");
      const strip = $("#rk-strip");
      if (strip) strip.classList.add("hid");
      closeDrop();

      html(`<div style="padding-top:20px"><h1>&gt; ${esc(CONTENT.title)}_</h1>
  <div class="mu">${esc(CONTENT.subtitle)}</div></div>
  <div class="pn"><div class="mu" style="margin-bottom:8px">Escribe tu nombre para entrar a la sala</div>
  <input id="nm" maxlength="24" placeholder="Nombre y apellido" autocomplete="off">
  <button class="pri" style="margin-top:12px" id="go">Iniciar sesión</button></div>
  <div class="mu">${CONTENT.questions.length} preguntas · ${CONTENT.levels.length} niveles · ${isOnline ? "conectado a la clase" : "resultados guardados en tu móvil"}</div>`);
      const inp = $("#nm"), go = $("#go");
      inp.onkeydown = e => { if (e.key === "Enter") go.click(); };
      go.onclick = () => {
        const n = inp.value.trim();
        if (n.length < 2) {
          inp.classList.add("shake");
          setTimeout(() => inp.classList.remove("shake"), 350);
          inp.focus();
          return;
        }
        S = {
          id: rnd(),
          name: n,
          i: 0,
          score: 0,
          streak: 0,
          ok: 0,
          sub: new Array(CONTENT.levels.length).fill(0),
          intro: -1,
          t: getServerTime()
        };
        push();
        flow();
      };
    }

    let locked = false;
    function flow() {
      locked = false;
      document.body.classList.add("has-strip");
      const strip = $("#rk-strip");
      if (strip) strip.classList.remove("hid");

      if (S.i >= CONTENT.questions.length) return end();
      const q = CONTENT.questions[S.i];
      if (S.intro !== q.level) { return intro(q.level); }
      ask();
    }

    function intro(lvlIdx) {
      const lvl = CONTENT.levels[lvlIdx] || { name: `Nivel ${lvlIdx + 1}`, theory: "", formula: "" };
      html(`<div class="top"><span class="tag">Nivel ${lvlIdx + 1}/${CONTENT.levels.length}</span><span class="mu">${S.score} pts</span></div>
  <h2>${esc(lvl.name)}</h2><div class="pn"><p style="margin:0 0 10px">${escBr(lvl.theory)}</p><div class="fm">${escBr(lvl.formula)}</div></div>
  <button class="pri" id="st">Empezar nivel</button>`);
      $("#st").onclick = () => { S.intro = lvlIdx; push(); ask(); };
    }

    function ask() {
      const q = CONTENT.questions[S.i];
      const lvl = CONTENT.levels[q.level] || { name: `Nivel ${q.level + 1}` };
      const lvlStart = CONTENT.questions.findIndex(x => x.level === q.level);
      const inLvl = S.i - lvlStart + 1;
      const totLvl = CONTENT.questions.filter(x => x.level === q.level).length;

      let body = "";
      if (q.type === "mc") {
        body = `<div class="opts">${q.options.map((o, i) => `<button data-i="${i}">${escBr(o)}</button>`).join("")}</div>`;
      } else if (q.type === "tf") {
        body = `<div class="opts"><button data-i="0">Verdadero</button><button data-i="1">Falso</button></div>`;
      } else {
        body = `<input id="nv" inputmode="${q.answer < 0 ? "text" : "decimal"}" placeholder="Tu respuesta" autocomplete="off"><button class="pri" style="margin-top:10px" id="ck">Verificar</button>`;
      }

      html(`<div class="top"><span class="tag">${esc(lvl.name)} · ${inLvl}/${totLvl}</span><span><span class="gold">${S.score}</span> pts${S.streak > 1 ? ` · racha ${S.streak}` : ""}</span></div>
  <div class="bar"><i style="width:${(S.i / CONTENT.questions.length) * 100}%"></i></div>
  <div class="pn" id="card"><div class="mu">${q.type === "mc" ? "Opción múltiple" : q.type === "tf" ? "Verdadero o falso" : "Respuesta numérica"}</div><div class="q">${escBr(q.text)}</div>${body}</div>
  <div id="fb" role="status" aria-live="polite" aria-atomic="true"></div>`);

      if (q.type === "num") {
        const nv = $("#nv"), ck = $("#ck");
        nv.onkeydown = e => { if (e.key === "Enter") ck.click(); };
        ck.onclick = () => {
          const raw = nv.value.trim().replace(/−/g, "-").replace(",", ".");
          const v = parseFloat(raw);
          if (raw === "" || isNaN(v)) {
            nv.classList.add("shake");
            setTimeout(() => nv.classList.remove("shake"), 350);
            nv.focus();
            return;
          }
          resolve(v === q.answer, null);
        };
      } else {
        document.querySelectorAll(".opts button").forEach(b => b.onclick = () => resolve(+b.dataset.i === q.answer, b));
      }
    }

    function resolve(good, btn) {
      if (locked || !CONTENT.questions[S.i]) return;
      locked = true;
      const q = CONTENT.questions[S.i], card = $("#card");
      document.querySelectorAll(".opts button,#ck,#nv").forEach(e => e.disabled = true);
      if (q.type !== "num") {
        const bs = document.querySelectorAll(".opts button");
        if (bs[q.answer]) bs[q.answer].classList.add("ok");
        if (!good && btn) btn.classList.add("no");
      }
      if (good) {
        const basePts = (CONTENT.points && typeof CONTENT.points.base === "number") ? CONTENT.points.base : 100;
        const streakBonus = (CONTENT.points && typeof CONTENT.points.streakBonus === "number") ? CONTENT.points.streakBonus : 20;
        const streakMax = (CONTENT.points && typeof CONTENT.points.streakMax === "number") ? CONTENT.points.streakMax : 5;
        const g = basePts + Math.min(S.streak, streakMax) * streakBonus;
        S.score += g;
        S.streak++;
        S.ok++;
        if (!Array.isArray(S.sub)) S.sub = new Array(CONTENT.levels.length).fill(0);
        S.sub[q.level] = (S.sub[q.level] || 0) + 1;
        card.classList.add("pulse");
        burst(card, g);
      } else {
        S.streak = 0;
        card.classList.add("shake");
      }
      S.i++;
      push();

      const isLevelEnd = (S.i < CONTENT.questions.length && CONTENT.questions[S.i].level !== q.level);
      const isGameEnd = S.i >= CONTENT.questions.length;

      const okMsg = (CONTENT.ui && CONTENT.ui.correctMsg) || "✔ Correcto";
      const badMsg = (CONTENT.ui && CONTENT.ui.wrongMsg) || "✘ Incorrecto";
      const btnEnd = (CONTENT.ui && CONTENT.ui.btnEndGame) || "Ver resultado";
      const btnLvl = (CONTENT.ui && CONTENT.ui.btnNextLevel) || "Completar nivel y ver ranking";
      const btnCont = (CONTENT.ui && CONTENT.ui.btnContinue) || "Continuar";
      const btnText = isGameEnd ? btnEnd : isLevelEnd ? btnLvl : btnCont;

      $("#fb").innerHTML = `<div class="pn"><b class="${good ? "ok" : "bad"}">${good ? esc(okMsg) : esc(badMsg)}</b><div class="mu" style="margin:6px 0 12px;font-size:14px">${q.type === "num" && !good ? "Respuesta: " + q.answer + ". " : ""}${escBr(q.explain)}</div><button class="pri" id="nx">${esc(btnText)}</button></div>`;
      $("#nx").onclick = () => {
        if (isLevelEnd) openDrop();
        flow();
      };
      $("#nx").scrollIntoView({ block: "nearest" });
    }

    /* Animación DOM ligera */
    function burst(el, g) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + 60;
      for (let i = 0; i < 16; i++) {
        const s = document.createElement("span");
        s.className = "fx";
        s.textContent = Math.random() < .5 ? "0" : "1";
        s.style.left = cx + "px";
        s.style.top = cy + "px";
        s.style.setProperty("--dx", (Math.random() * 240 - 120) + "px");
        s.style.setProperty("--dy", (Math.random() * 160 - 110) + "px");
        s.style.animationDelay = (Math.random() * .15) + "s";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1300);
      }
      const p = document.createElement("div");
      p.className = "pts";
      p.textContent = "+" + g;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1100);
    }

    function end() {
      const pct = Math.round(S.ok / (CONTENT.questions.length || 1) * 100);
      const endTitle = (CONTENT.ui && CONTENT.ui.endTitle) || "Sesión completada";
      const endBtnRk = (CONTENT.ui && CONTENT.ui.endBtnRanking) || "Ver ranking en vivo";
      const endBtnRs = (CONTENT.ui && CONTENT.ui.endBtnRestart) || "Jugar de nuevo";

      const lvlBreakdown = CONTENT.levels.map((lvl, idx) => {
        const lvlTot = CONTENT.questions.filter(q => q.level === idx).length;
        const done = (S.sub && S.sub[idx]) || 0;
        const barPct = lvlTot > 0 ? Math.round((done / lvlTot) * 100) : 0;

    function insertSymbol(sym) {
      if (!activeTextEl) return;
      const start = activeTextEl.selectionStart !== undefined ? activeTextEl.selectionStart : activeTextEl.value.length;
      const end = activeTextEl.selectionEnd !== undefined ? activeTextEl.selectionEnd : activeTextEl.value.length;
      const val = activeTextEl.value;
      activeTextEl.value = val.slice(0, start) + sym + val.slice(end);
      const newPos = start + sym.length;
      activeTextEl.selectionStart = activeTextEl.selectionEnd = newPos;
      activeTextEl.dispatchEvent(new Event("input", { bubbles: true }));
      activeTextEl.focus();
    }

    function renderSymbolBar() {

      <div class="top" style="margin-bottom:6px">
        <label>Opciones (marca la opción correcta):</label>
        ${q.options.length < 5 ? '<button type="button" class="adm-btn-sm pri" id="ed-add-opt" style="width:auto;min-height:30px;padding:2px 8px;font-size:11px">➕ Opción</button>' : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${q.options.map((opt, i) => `
          <div style="display:flex;gap:6px;align-items:center">
            <input type="radio" name="ed-mc-ans" data-optidx="${i}" ${q.answer === i ? 'checked' : ''} style="width:20px;min-height:20px;cursor:pointer" title="Marcar como correcta">
            <input class="ed-opt-text" data-optidx="${i}" value="${esc(opt)}" placeholder="Opción ${i + 1}" style="flex:1">
            ${q.options.length > 2 ? `<button type="button" class="adm-btn-sm btn-dan ed-del-opt" data-optidx="${i}" style="width:36px;min-height:44px;padding:0">✕</button>` : ''}
          </div>
        `).join("")}
      </div>
    </div>`;
      } else if (q.type === "tf") {
        return `<div class="adm-fld">
      <label>Respuesta correcta:</label>
      <div style="display:flex;gap:10px">
        <label style="flex:1;display:flex;align-items:center;gap:6px;background:var(--pn);padding:10px;border-radius:6px;border:1px solid var(--ln);cursor:pointer">
          <input type="radio" name="ed-tf-ans" value="0" ${q.answer === 0 ? 'checked' : ''} style="width:20px;min-height:20px">
          <span>Verdadero</span>
        </label>
        <label style="flex:1;display:flex;align-items:center;gap:6px;background:var(--pn);padding:10px;border-radius:6px;border:1px solid var(--ln);cursor:pointer">
          <input type="radio" name="ed-tf-ans" value="1" ${q.answer === 1 ? 'checked' : ''} style="width:20px;min-height:20px">
          <span>Falso</span>
        </label>
      </div>
    </div>`;
      } else {
        return `<div class="adm-fld">
      <label>Valor numérico correcto:</label>
      <input type="number" step="any" id="ed-num-ans" value="${q.answer !== undefined ? q.answer : 0}" placeholder="Ej. 32 o -5">
    </div>`;
      }
    }

    function bindEditorSpecificEvents(q) {
      if (q.type === "mc") {
        const addBtn = $("#ed-add-opt");
        if (addBtn) {
          addBtn.onclick = () => {
            if (q.options.length < 5) {
              q.options.push(`Opción ${q.options.length + 1}`);
              $("#ed-type-specific").innerHTML = renderEditorTypeSpecific(q);
              bindEditorSpecificEvents(q);
              updateLivePreview(q);
            }
          };
        }
        document.querySelectorAll("input[name='ed-mc-ans']").forEach(r => {
          r.onchange = e => {
            q.answer = +e.target.dataset.optidx;
            updateLivePreview(q);
          };
        });
        document.querySelectorAll(".ed-opt-text").forEach(inp => {
          inp.oninput = e => {
            q.options[+e.target.dataset.optidx] = e.target.value;
            updateLivePreview(q);
          };
        });
        document.querySelectorAll(".ed-del-opt").forEach(b => {
          b.onclick = () => {
            const idx = +b.dataset.optidx;
            if (q.options.length <= 2) return;
            q.options.splice(idx, 1);
            if (q.answer >= q.options.length) q.answer = q.options.length - 1;
            $("#ed-type-specific").innerHTML = renderEditorTypeSpecific(q);
            bindEditorSpecificEvents(q);
            updateLivePreview(q);
          };
        });
      } else if (q.type === "tf") {
        document.querySelectorAll("input[name='ed-tf-ans']").forEach(r => {
          r.onchange = e => {
            q.answer = +e.target.value;
            updateLivePreview(q);
          };
        });
      } else if (q.type === "num") {
        const numInp = $("#ed-num-ans");
        if (numInp) {
          numInp.oninput = e => {
            const parsed = parseFloat(e.target.value);
            q.answer = isNaN(parsed) ? 0 : parsed;
            updateLivePreview(q);
          };
        }
      }
    }

    function updateLivePreview(q) {
      const box = $("#ed-live-preview");
      if (!box || !q) return;

      let body = "";
      if (q.type === "mc") {
        body = `<div class="opts">${q.options.map((o, i) => `
          <button style="border-color:${i === q.answer ? 'var(--ok)' : 'var(--ln)'};background:${i === q.answer ? '#4fd1a118' : 'var(--pn)'}">
            ${escBr(o)} ${i === q.answer ? '<span class="ok" style="font-size:11px">✔ (Correcta)</span>' : ''}
          </button>
        `).join("")}</div>`;
      } else if (q.type === "tf") {
        body = `<div class="opts">
          <button style="border-color:${q.answer === 0 ? 'var(--ok)' : 'var(--ln)'};background:${q.answer === 0 ? '#4fd1a118' : 'var(--pn)'}">Verdadero ${q.answer === 0 ? '✔' : ''}</button>
          <button style="border-color:${q.answer === 1 ? 'var(--ok)' : 'var(--ln)'};background:${q.answer === 1 ? '#4fd1a118' : 'var(--pn)'}">Falso ${q.answer === 1 ? '✔' : ''}</button>
        </div>`;
      } else {
        body = `<input placeholder="Tu respuesta (ej: ${q.answer})" disabled><button class="pri" style="margin-top:10px" disabled>Verificar</button><div class="mu" style="font-size:12px;margin-top:4px">Respuesta esperada: <b>${q.answer}</b></div>`;
      }

      box.innerHTML = `<div class="mu" style="font-size:12px">${q.type === 'mc' ? 'Opción múltiple' : q.type === 'tf' ? 'Verdadero o falso' : 'Respuesta numérica'}</div>
    <div class="q">${escBr(q.text)}</div>
    ${body}
    <div class="mu" style="margin-top:8px;font-size:12px"><b>Explicación:</b> ${escBr(q.explain)}</div>`;
    }

    function renderSettingsTab(container) {
      container.innerHTML = `<div class="adm-sec">
    <div class="pn">
      <div style="font-weight:700;font-size:14px;margin-bottom:8px">Sistema de Puntuación</div>
      <div class="adm-fld">
        <label>Puntos base por respuesta correcta</label>
        <input type="number" id="pts-base" value="${CONTENT.points.base}">
      </div>
      <div class="adm-fld">
        <label>Bono adicional por cada punto de racha</label>
        <input type="number" id="pts-bonus" value="${CONTENT.points.streakBonus}">
      </div>
      <div class="adm-fld">
        <label>Tope máximo de multiplicador de racha</label>
        <input type="number" id="pts-max" value="${CONTENT.points.streakMax}">
      </div>
    </div>

    <div class="pn" style="display:flex;flex-direction:column;gap:10px">
      <div style="font-weight:700;font-size:14px">Gestión de Contenido JSON</div>
      <button id="adm-export-btn">📤 Exportar contenido a JSON</button>
      <button id="adm-import-btn">📥 Importar contenido desde JSON</button>
      <button class="btn-dan" id="adm-restore-btn">↺ Restaurar valores por defecto</button>
    </div>

    <div class="pn" style="display:flex;flex-direction:column;gap:10px;border-color:#7d262e">
      <div style="font-weight:700;font-size:14px;color:var(--bad)">Zona Peligrosa</div>
      <button class="btn-dan" id="adm-clear-rk-btn">🗑 Limpiar ranking de la sala ahora</button>
    </div>
  </div>`;

      $("#pts-base").oninput = e => { CONTENT.points.base = Number(e.target.value) || 100; };
      $("#pts-bonus").oninput = e => { CONTENT.points.streakBonus = Number(e.target.value) || 20; };
      $("#pts-max").oninput = e => { CONTENT.points.streakMax = Number(e.target.value) || 5; };

      $("#adm-export-btn").onclick = () => {
        const jsonStr = JSON.stringify(CONTENT, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `algebraops_content_v${CONTENT.v}.json`;
        a.click();
        URL.revokeObjectURL(url);
        navigator.clipboard?.writeText(jsonStr);
        alert("JSON descargado y copiado al portapapeles.");
      };

      $("#adm-import-btn").onclick = () => {
        const pasted = prompt("Pega aquí el contenido JSON completo:");
        if (!pasted) return;
        try {
          const parsed = JSON.parse(pasted);
          if (!validateContent(parsed)) {
            alert("Error: El JSON no cumple con la estructura requerida.");
            return;
          }
          CONTENT = parsed;
          renderAdminDashboard();
          showAdminStatus("JSON importado correctamente en memoria. Presiona 'Guardar' para subirlo a la nube.", true);
        } catch (e) {
          alert("Error al parsear JSON: " + e.message);
        }
      };

      $("#adm-restore-btn").onclick = () => {
        if (!confirm("¿Restaurar todo el contenido a los valores por defecto originales? Se perderán las modificaciones no guardadas.")) return;
        CONTENT = JSON.parse(JSON.stringify(DEFAULT_CONTENT));
        renderAdminDashboard();
        showAdminStatus("Contenido restaurado a los valores por defecto en memoria. Recuerda guardar cambios.", true);
      };

      $("#adm-clear-rk-btn").onclick = () => {
        if (!confirm("¿Seguro que deseas eliminar TODOS los puntajes y jugadores de la sala de clase? Esta acción es irreversible.")) return;
        if (!db) return alert("Base de datos no conectada");
        db.ref("rooms/" + ROOM).remove().then(() => {
          showAdminStatus("Ranking de la sala limpiado completamente.", true);
          alert("Ranking limpiado con éxito.");
        }).catch(err => {
          showAdminStatus("Error al limpiar ranking: " + err.message, false);
          alert("Error: " + err.message);
        });
      };
    }

    function saveAdminContent() {
      if (!auth || !auth.currentUser || auth.currentUser.email !== ADMIN_EMAIL) {
        showAdminStatus("No tienes permisos de administrador.", false);
        return;
      }

      // 1. Validaciones
      if (!CONTENT.levels || CONTENT.levels.length < 1) {
        showAdminStatus("Error: Debe existir al menos 1 nivel.", false);
        return;
      }
      if (!CONTENT.questions || CONTENT.questions.length < 1) {
        showAdminStatus("Error: Debe existir al menos 1 pregunta.", false);
        return;
      }

      for (let i = 0; i < CONTENT.levels.length; i++) {
        if (!CONTENT.levels[i].name || !CONTENT.levels[i].name.trim()) {
          showAdminStatus(`Error: El Nivel ${i + 1} no tiene nombre.`, false);
          return;
        }
      }

      for (let j = 0; j < CONTENT.questions.length; j++) {
        const q = CONTENT.questions[j];
        if (!q.text || !q.text.trim()) {
          showAdminStatus(`Error: La pregunta #${j + 1} tiene el enunciado vacío.`, false);
          return;
        }
        if (q.level < 0 || q.level >= CONTENT.levels.length) {
          showAdminStatus(`Error: La pregunta #${j + 1} está asignada a un nivel inexistente.`, false);
          return;
        }
        if (q.type === "mc") {
          if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 5) {
            showAdminStatus(`Error: La pregunta #${j + 1} (opción múltiple) debe tener entre 2 y 5 opciones.`, false);
            return;
          }
          if (q.options.some(o => !o || !o.trim())) {
            showAdminStatus(`Error: La pregunta #${j + 1} contiene opciones vacías.`, false);
            return;
          }
          if (typeof q.answer !== "number" || q.answer < 0 || q.answer >= q.options.length) {
            showAdminStatus(`Error: La pregunta #${j + 1} no tiene una opción correcta válida seleccionada.`, false);
            return;
          }
        } else if (q.type === "tf") {
          if (q.answer !== 0 && q.answer !== 1) {
            showAdminStatus(`Error: La pregunta #${j + 1} debe marcar Verdadero o Falso.`, false);
            return;
          }
        } else if (q.type === "num") {
          if (typeof q.answer !== "number" || isNaN(q.answer)) {
            showAdminStatus(`Error: La pregunta #${j + 1} debe tener una respuesta numérica válida.`, false);
            return;
          }
        }
      }

      // 2. Incrementar versión y guardar
      CONTENT.v = (Number(CONTENT.v) || 0) + 1;
      const saveBtn = $("#adm-save-btn");
      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "Guardando en la nube…"; }

      try {
        localStorage.setItem("ao_content", JSON.stringify(CONTENT));
      } catch (e) { }

      if (!db) {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "💾 Guardar cambios en la nube"; }
        showAdminStatus("Guardado en almacenamiento local (sin conexión a Firebase).", true);
        return;
      }

      db.ref("content/" + ROOM).set(CONTENT).then(() => {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "💾 Guardar cambios en la nube"; }
        showAdminStatus(`✔ Guardado con éxito en Firebase (Versión ${CONTENT.v})`, true);
        const hdrSub = document.querySelector(".adm-hdr .mu");
        if (hdrSub) hdrSub.textContent = `${auth.currentUser.email} · v${CONTENT.v}`;
      }).catch(err => {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "💾 Guardar cambios en la nube"; }
        showAdminStatus("Error al guardar en Firebase: " + (err.message || err), false);
      });
    }

    /* Ruteo y navegación */
    function navigate() {
      if (location.hash === "#admin") {
        adminView();
      } else if (location.hash === "#ranking") {
        projectorView();
      } else {
        if (S && S.name) flow();
        else login();
      }
    }

    // Registrar foco de inputs/textareas para la barra de símbolos matemáticos
    document.addEventListener("focusin", e => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
        activeTextEl = e.target;
      }
    });

    /* Listeners de interacción con la franja y desplegable */
    const rkStripEl = $("#rk-strip");
    if (rkStripEl) {
      rkStripEl.onclick = () => toggleDrop();
      rkStripEl.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleDrop(); } };
    }
    const dropBgEl = $("#drop-bg");
    if (dropBgEl) dropBgEl.onclick = () => closeDrop();
    const dropCloseEl = $("#drop-close-btn");
    if (dropCloseEl) dropCloseEl.onclick = () => closeDrop();
    window.addEventListener("hashchange", navigate);

    loadInitialContent(() => {
      initFirebase();
      navigate();
    });
  </script>
</body>

</html>
